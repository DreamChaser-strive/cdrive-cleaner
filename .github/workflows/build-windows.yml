name: Build Windows portable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable app
        run: npm run build:win

      - name: Write checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter 'DriveCleaner-*-portable.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable executable was not produced.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: 磁盘空间清理 ${{ github.ref_name }} · Windows 桌面版
          files: |
            dist/DriveCleaner-*-portable.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            ## 下载应用

            请下载本页 **Assets** 中的 **DriveCleaner-*-portable.exe**（Windows x64 便携版），双击即可运行。不需要安装 Node.js，也不需要打开命令行或浏览器。

            > 页面底部的 `Source code (zip)` 只是源码，不包含应用程序。若已经下载了源码 ZIP，可解压后双击 `download-app.bat` 自动获取最新 exe。

            首次启动会自动扫描系统盘；顶部可切换到 D、E 等其他磁盘，点击「重新扫描」即可分析该盘。

            ## 功能

            - 多磁盘切换：自动识别固定磁盘和可移动磁盘，每个盘符独立保存扫描结果。
            - 方块空间图：按文件大小绘制可交互的 treemap，单击选中、双击进入目录。
            - 实时扫描：重新扫描时方块、容量条和目录大小会随扫描进度持续变化。
            - 目录明细与搜索：按大小排序、查看子目录和文件，支持当前磁盘全盘搜索。
            - 清理建议：系统盘区分推荐清理、谨慎清理和系统项目；其他磁盘展示大目录快捷入口。
            - 两种删除方式：默认移入回收站；永久删除需要二次勾选确认。
            - 安全防护：禁止删除磁盘根目录；系统盘保护 Windows、Program Files、ProgramData、用户主目录等；所有磁盘均保护回收站和系统保留区域。

            ## 使用提醒

            - 应用未做代码签名，Windows SmartScreen 可能提示「Windows 已保护你的电脑」。点击「更多信息」→「仍要运行」即可。
            - 扫描数据保存在 `%APPDATA%\DriveCleaner\data`，重开应用无需重新扫描。
            - 扫描进行中仍可浏览和搜索，但删除按钮会暂时锁定，避免统计结果变化。
            - 本工具会执行真实文件删除操作，请先备份重要数据，只清理确认无用的缓存或测试文件。
            - Windows、Program Files、ProgramData、用户主目录等系统/个人目录受保护，工具不会直接删除。

            ## 文件校验

            下载附带的 `SHA256SUMS.txt` 可核对 exe 的 SHA-256。

            ## 从源码运行

            ```bash
            git clone https://github.com/DreamChaser-strive/drive-cleaner.git
            cd drive-cleaner
            npm install
            npm start
            ```

            详细说明见仓库 README。
