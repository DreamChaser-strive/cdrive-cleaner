appId: com.dreamchaserstrive.cdrivecleaner
productName: C盘空间清理
copyright: Copyright © 2026 DreamChaser-strive
asar: false
npmRebuild: false
compression: normal

directories:
  output: dist
  buildResources: build

files:
  - electron/**/*
  - public/**/*
  - server.js
  - scan.js
  - recycle.ps1
  - package.json
  - build/icon.png
  - build/icon.ico

win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker

portable:
  artifactName: CDriveCleaner-${version}-portable.${ext}
